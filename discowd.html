<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>goofy ahh discord sender</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 520px;
    padding: 25px;
    background: #1f2937;
    border-radius: 15px;
    box-shadow: 0 10px 40px #0008;
}

h1 {
    margin-top: 0;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
}

textarea,
input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #374151;
    border-radius: 8px;
    background: #111827;
    color: white;
    font-size: 15px;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

button:hover {
    opacity: 0.9;
}

.secondary {
    background: #374151;
}

.danger {
    background: #dc2626;
}

.status {
    margin-top: 5px;
    padding: 10px;
    background: #111827;
    border-radius: 8px;
    min-height: 20px;
    word-break: break-word;
}

.hidden {
    display: none;
}

.small {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 15px;
}

.webhook {
    padding: 15px;
    margin-bottom: 12px;
    background: #111827;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

    <!-- SEND PAGE -->

    <div id="sendPage">

        <h1>goofy ahh discord sender</h1>

        <label>which webhook are we cooking?</label>

        <select id="webhookSelect"></select>

        <label>type your goofy ahh message</label>

        <textarea
            id="message"
            placeholder="say something absolutely unnecessary..."
        ></textarea>

        <button onclick="sendMessage()">
            YEET IT TO DISCORD
        </button>

        <button
            class="secondary"
            onclick="clearMessage()">
            erase my evidence
        </button>

        <button
            class="secondary"
            onclick="showSettings()">
            configure the forbidden webhook technology
        </button>

        <div id="status" class="status">
            standing by for nonsense...
        </div>

    </div>


    <!-- SETTINGS PAGE -->

    <div id="settingsPage" class="hidden">

        <h1>webhook wizardry department</h1>

        <div class="small">
            webhook stuff is stored locally because apparently that's easier.
        </div>

        <div id="webhookList"></div>

        <button onclick="addWebhook()">
            + summon another webhook
        </button>

        <button onclick="saveSettings()">
            save this nonsense
        </button>

        <button
            class="secondary"
            onclick="showSendPage()">
            ← escape the settings dimension
        </button>

    </div>

</div>


<script>

/* =========================
   LOAD THE SILLY WEBHOOKS
========================= */

let webhooks = JSON.parse(
    localStorage.getItem("discordWebhooks") || "[]"
);


/* =========================
   WEBHOOK SELECTOR OF DOOM
========================= */

function refreshWebhookSelect() {

    const select =
        document.getElementById("webhookSelect");

    select.innerHTML = "";

    if (webhooks.length === 0) {

        const option =
            document.createElement("option");

        option.textContent =
            "no webhooks detected. absolutely tragic.";

        option.value = "";

        select.appendChild(option);

        return;
    }

    webhooks.forEach((webhook, index) => {

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            webhook.name ||
            "mysterious webhook " + (index + 1);

        select.appendChild(option);
    });
}


/* =========================
   YEET MESSAGE
========================= */

async function sendMessage() {

    const message =
        document.getElementById("message").value;

    const selected =
        document.getElementById("webhookSelect").value;

    const status =
        document.getElementById("status");


    if (!message.trim()) {

        status.textContent =
            "bro typed absolutely nothing.";

        return;
    }


    if (webhooks.length === 0) {

        status.textContent =
            "there are no webhooks. we are cooked.";

        return;
    }


    const webhook =
        webhooks[selected];


    if (!webhook || !webhook.url) {

        status.textContent =
            "this webhook is built different. and not in a good way.";

        return;
    }


    status.textContent =
        "launching the message into the discord dimension...";


    try {

        const response =
            await fetch(
                webhook.url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        content: message
                    })
                }
            );


        if (response.ok) {

            status.textContent =
                "message successfully yeeted into discord.";

        } else {

            const text =
                await response.text();

            status.textContent =
                "discord said no. HTTP " +
                response.status +
                ": " +
                text;
        }

    } catch (error) {

        status.textContent =
            "the internet exploded: " +
            error.message;
    }
}


/* =========================
   DELETE THE EVIDENCE
========================= */

function clearMessage() {

    document.getElementById(
        "message"
    ).value = "";

    document.getElementById(
        "status"
    ).textContent =
        "evidence successfully erased. probably.";
}


/* =========================
   ENTER THE WEBHOOK DIMENSION
========================= */

function showSettings() {

    document.getElementById(
        "sendPage"
    ).classList.add("hidden");

    document.getElementById(
        "settingsPage"
    ).classList.remove("hidden");

    renderSettings();
}


function showSendPage() {

    document.getElementById(
        "settingsPage"
    ).classList.add("hidden");

    document.getElementById(
        "sendPage"
    ).classList.remove("hidden");

    refreshWebhookSelect();
}


/* =========================
   WEBHOOK WIZARDRY
========================= */

function renderSettings() {

    const list =
        document.getElementById("webhookList");

    list.innerHTML = "";


    webhooks.forEach((webhook, index) => {

        const div =
            document.createElement("div");

        div.className = "webhook";


        div.innerHTML = `
            <label>what do we call this silly thing?</label>

            <input
                type="text"
                class="apiName"
                data-index="${index}"
                value="${escapeHTML(webhook.name || "")}"
                placeholder="main server, goofy server, etc."
            >

            <label>forbidden webhook url</label>

            <input
                type="text"
                class="apiURL"
                data-index="${index}"
                value="${escapeHTML(webhook.url || "")}"
                placeholder="https://discord.com/api/webhooks/..."
            >

            <button
                class="danger"
                onclick="removeWebhook(${index})">
                DELETE THIS CREATURE
            </button>
        `;

        list.appendChild(div);
    });
}


/* =========================
   SUMMON WEBHOOK
========================= */

function addWebhook() {

    webhooks.push({
        name: "new suspicious webhook",
        url: ""
    });

    renderSettings();
}


/* =========================
   BANISH WEBHOOK
========================= */

function removeWebhook(index) {

    webhooks.splice(index, 1);

    renderSettings();
}


/* =========================
   SAVE THE NONSENSE
========================= */

function saveSettings() {

    const names =
        document.querySelectorAll(".apiName");

    const urls =
        document.querySelectorAll(".apiURL");


    const newWebhooks = [];


    for (let i = 0; i < names.length; i++) {

        const name =
            names[i].value.trim();

        const url =
            urls[i].value.trim();


        if (url) {

            newWebhooks.push({
                name:
                    name ||
                    "mysterious webhook " + (i + 1),

                url: url
            });
        }
    }


    webhooks =
        newWebhooks;


    localStorage.setItem(
        "discordWebhooks",
        JSON.stringify(webhooks)
    );


    location.reload();
}


/* =========================
   HTML ESCAPING BECAUSE SECURITY
   IS ALSO KINDA IMPORTANT
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   WAKE UP THE MACHINE
========================= */

refreshWebhookSelect();

</script>

</body>
</html>
