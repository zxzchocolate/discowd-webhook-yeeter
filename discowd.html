```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Webhook Sender</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 520px;
    padding: 25px;
    background: #1f2937;
    border-radius: 15px;
    box-shadow: 0 10px 40px #0008;
}

h1 {
    margin-top: 0;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
}

textarea,
input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #374151;
    border-radius: 8px;
    background: #111827;
    color: white;
    font-size: 15px;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

button:hover {
    opacity: 0.9;
}

.secondary {
    background: #374151;
}

.danger {
    background: #dc2626;
}

.status {
    margin-top: 5px;
    padding: 10px;
    background: #111827;
    border-radius: 8px;
    min-height: 20px;
    word-break: break-word;
}

.hidden {
    display: none;
}

.small {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 15px;
}

.webhook {
    padding: 15px;
    margin-bottom: 12px;
    background: #111827;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

    <!-- SEND PAGE -->

    <div id="sendPage">

        <h1>Discord Sender</h1>

        <label>API / Webhook</label>

        <select id="webhookSelect"></select>

        <label>Message</label>

        <textarea
            id="message"
            placeholder="What do you want to send?"
        ></textarea>

        <button onclick="sendMessage()">
            Send
        </button>

        <button
            class="secondary"
            onclick="clearMessage()">
            Clear
        </button>

        <button
            class="secondary"
            onclick="showSettings()">
            ⚙ Configure APIs
        </button>

        <div id="status" class="status">
            Ready.
        </div>

    </div>


    <!-- SETTINGS PAGE -->

    <div id="settingsPage" class="hidden">

        <h1>Configure APIs</h1>

        <div class="small">
            APIs are saved locally in this browser.
        </div>

        <div id="webhookList"></div>

        <button onclick="addWebhook()">
            + Add API
        </button>

        <button onclick="saveSettings()">
            Save & Refresh
        </button>

        <button
            class="secondary"
            onclick="showSendPage()">
            ← Back
        </button>

    </div>

</div>


<script>

/* =========================
   LOAD SAVED WEBHOOKS
========================= */

let webhooks = JSON.parse(
    localStorage.getItem("discordWebhooks") || "[]"
);


/* =========================
   SEND PAGE
========================= */

function refreshWebhookSelect() {

    const select =
        document.getElementById("webhookSelect");

    select.innerHTML = "";

    if (webhooks.length === 0) {

        const option =
            document.createElement("option");

        option.textContent =
            "No APIs configured";

        option.value = "";

        select.appendChild(option);

        return;
    }

    webhooks.forEach((webhook, index) => {

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            webhook.name ||
            "API " + (index + 1);

        select.appendChild(option);
    });
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const message =
        document.getElementById("message").value;

    const selected =
        document.getElementById("webhookSelect").value;

    const status =
        document.getElementById("status");


    if (!message.trim()) {

        status.textContent =
            "Enter a message first.";

        return;
    }


    if (webhooks.length === 0) {

        status.textContent =
            "Configure an API first.";

        return;
    }


    const webhook =
        webhooks[selected];


    if (!webhook || !webhook.url) {

        status.textContent =
            "Invalid API configuration.";

        return;
    }


    status.textContent =
        "Sending...";


    try {

        const response =
            await fetch(
                webhook.url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        content: message
                    })
                }
            );


        if (response.ok) {

            /*
                IMPORTANT:
                The message is NOT cleared.
            */

            status.textContent =
                "✓ Message sent!";

        } else {

            const text =
                await response.text();

            status.textContent =
                "Discord returned HTTP " +
                response.status +
                ": " +
                text;
        }

    } catch (error) {

        status.textContent =
            "Error: " + error.message;
    }
}


/* =========================
   CLEAR MESSAGE
========================= */

function clearMessage() {

    document.getElementById(
        "message"
    ).value = "";

    document.getElementById(
        "status"
    ).textContent = "Ready.";
}


/* =========================
   SETTINGS
========================= */

function showSettings() {

    document.getElementById(
        "sendPage"
    ).classList.add("hidden");

    document.getElementById(
        "settingsPage"
    ).classList.remove("hidden");

    renderSettings();
}


function showSendPage() {

    document.getElementById(
        "settingsPage"
    ).classList.add("hidden");

    document.getElementById(
        "sendPage"
    ).classList.remove("hidden");

    refreshWebhookSelect();
}


/* =========================
   RENDER API SETTINGS
========================= */

function renderSettings() {

    const list =
        document.getElementById("webhookList");

    list.innerHTML = "";


    webhooks.forEach((webhook, index) => {

        const div =
            document.createElement("div");

        div.className = "webhook";


        div.innerHTML = `
            <label>API Name</label>

            <input
                type="text"
                class="apiName"
                data-index="${index}"
                value="${escapeHTML(webhook.name || "")}"
                placeholder="Example: Main Discord"
            >

            <label>Webhook URL</label>

            <input
                type="text"
                class="apiURL"
                data-index="${index}"
                value="${escapeHTML(webhook.url || "")}"
                placeholder="https://discord.com/api/webhooks/..."
            >

            <button
                class="danger"
                onclick="removeWebhook(${index})">
                Remove
            </button>
        `;

        list.appendChild(div);
    });
}


/* =========================
   ADD API
========================= */

function addWebhook() {

    webhooks.push({
        name: "New API",
        url: ""
    });

    renderSettings();
}


/* =========================
   REMOVE API
========================= */

function removeWebhook(index) {

    webhooks.splice(index, 1);

    renderSettings();
}


/* =========================
   SAVE SETTINGS
========================= */

function saveSettings() {

    const names =
        document.querySelectorAll(".apiName");

    const urls =
        document.querySelectorAll(".apiURL");


    const newWebhooks = [];


    for (let i = 0; i < names.length; i++) {

        const name =
            names[i].value.trim();

        const url =
            urls[i].value.trim();


        if (url) {

            newWebhooks.push({
                name:
                    name ||
                    "API " + (i + 1),

                url: url
            });
        }
    }


    webhooks =
        newWebhooks;


    localStorage.setItem(
        "discordWebhooks",
        JSON.stringify(webhooks)
    );


    /*
        Reload the page after saving.
    */

    location.reload();
}


/* =========================
   HTML ESCAPING
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

refreshWebhookSelect();

</script>

</body>
</html>
